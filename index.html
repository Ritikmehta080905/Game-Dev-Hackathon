<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ATHARVA.EXE — GlitchVerse | Artificial Arcade VI</title>
  <meta name="description" content="Official entry for PS01 GlitchVerse at Artificial Arcade VI. Edit the broken rules of reality to debug the simulation before the countdown ends!" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    html, body, #root {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0c152e;
      font-family: 'Plus Jakarta Sans', 'Outfit', sans-serif;
      color: #F8FAFC;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    /* Subtle scanlines overlay */
    .scanlines {
      pointer-events: none;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.15) 50%);
      background-size: 100% 4px;
      opacity: 0.35;
      z-index: 10;
    }
  </style>

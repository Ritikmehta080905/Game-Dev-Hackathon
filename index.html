<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ATHARVA.EXE — PS01: GlitchVerse | Artificial Arcade VI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600;700&family=Outfit:wght@400;600;800;900&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background-color: #060914;
      background-image: radial-gradient(circle at 50% 50%, #0d1533 0%, #060914 100%);
      color: #E2E8F0;
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    #game-container {
      position: relative;
      width: 1280px;
      height: 720px;
      max-width: 100vw;
      max-height: 100vh;
      aspect-ratio: 16 / 9;
      box-shadow: 0 0 50px rgba(0, 229, 255, 0.15), 0 0 100px rgba(255, 46, 147, 0.12);
      border: 1px solid rgba(0, 229, 255, 0.35);
      border-radius: 8px;
      overflow: hidden;
      transition: filter 0.1s ease-out;
    }
    canvas {
      display: block;
      width: 100% !important;
      height: 100% !important;
    }

    /* CRT Scanlines Overlay */
    .scanlines {
      pointer-events: none;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(
        rgba(18, 16, 16, 0) 50%, 
        rgba(0, 0, 0, 0.28) 50%
      );
      background-size: 100% 4px;
      opacity: 0.65;
      z-index: 10;
      animation: scanlineRoll 14s linear infinite;
    }

    /* CRT Vignette & Curvature Corner Glow */
    .crt-vignette {
      pointer-events: none;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      box-shadow: inset 0 0 80px rgba(11, 16, 38, 0.8), inset 0 0 120px rgba(0, 0, 0, 0.6);
      z-index: 11;
    }

    /* Chromatic Aberration & Glitch Pulse */
    .glitch-active {
      animation: glitchPulse 0.22s ease-in-out infinite;
      filter: drop-shadow(-3px 0 0 rgba(0, 229, 255, 0.6)) 
              drop-shadow(3px 0 0 rgba(255, 46, 147, 0.6)) 
              contrast(1.15) brightness(1.1);
    }

    @keyframes scanlineRoll {
      0% { background-position: 0 0; }
      100% { background-position: 0 100%; }
    }

    @keyframes glitchPulse {
      0% { transform: translate(0, 0); }
      25% { transform: translate(-2px, 1px); }
      50% { transform: translate(2px, -1px); }
      75% { transform: translate(-1px, -1px); }
      100% { transform: translate(0, 0); }
    }
  </style>
</head>
<body>
  <div id="game-container">
    <div class="scanlines"></div>
    <div class="crt-vignette"></div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
